<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>
<div class="sidebar-container">

  <!-- LOGO -->

  <div class="logo-section">

    <div class="logo-wrapper">

      <div class="logo-avatar">
        <img src="book.png" class="logo-icon" />
      </div>

      <div class="pulse-ring"></div>

    </div>

    <div>

      <h2 class="logo-title">

        LibraOne

      </h2>

      <p class="logo-subtitle">

        Library Hub

      </p>

    </div>

  </div>

  <!-- MAIN NAVIGATION -->

  <div class="main-nav">

    <div
      *ngFor="let item of navigationItems"
      class="nav-item"
      [ngClass]="{
        'active-nav': isActive(item.path)
      }"
      (click)="handleNavigation(item.path)"
    >

      <!-- LEFT -->

      <div class="nav-left">

        <!-- ICON -->

        <div class="icon-wrapper">

          <i [class]="item.icon"></i>

          <!-- BADGE -->

          <span
            *ngIf="
              item.badge
              && getBadgeCount(item.badge) > 0
            "
            class="badge-pill"
          >

            {{ getBadgeCount(item.badge) }}

          </span>

        </div>

        <!-- TITLE -->

        <span class="nav-title">

          {{ item.title }}

        </span>

      </div>

      <!-- ACTIVE DOT -->

      <div
        *ngIf="isActive(item.path)"
        class="active-dot"
      >
      </div>

    </div>

  </div>

  <!-- DIVIDER -->

  <div class="divider"></div>

  <!-- SECONDARY -->

  <div class="secondary-nav">

    <div
      *ngFor="let item of secondaryItems"
      class="secondary-item"
      [ngClass]="{
        'active-secondary': isActive(item.path)
      }"
      (click)="handleNavigation(item.path)"
    >

      <i [class]="item.icon"></i>

      <span>

        {{ item.title }}

      </span>

    </div>

  </div>

  <!-- LOGOUT -->

  <div class="logout-wrapper">

    <button
      class="logout-btn"
      (click)="handleLogout()"
    >

      <i class="fa-solid fa-right-from-bracket"></i>

      Logout

    </button>

  </div>

  <!-- FOOTER -->

  <div class="sidebar-footer">

    © 2026 LibraOne. All rights reserved.

  </div>

</div>
