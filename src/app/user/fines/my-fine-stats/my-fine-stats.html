<div class="row g-3 mb-4">

  <div class="col-md-3">

    <div class="card border-0 shadow-sm bg-danger-subtle">

      <div class="card-body text-center">

        <h2 class="fw-bold text-danger">

          {{
            filteredFines.filter(f => f.status === 'PENDING').length
          }}

        </h2>

        <p class="text-muted mb-0">
          Pending Fines
        </p>

      </div>

    </div>

  </div>

  <div class="col-md-3">

    <div class="card border-0 shadow-sm bg-success-subtle">

      <div class="card-body text-center">

        <h2 class="fw-bold text-success">

          {{
            filteredFines.filter(f => f.status === 'PAID').length
          }}

        </h2>

        <p class="text-muted mb-0">
          Paid Fines
        </p>

      </div>

    </div>

  </div>

  <div class="col-md-3">

    <div class="card border-0 shadow-sm bg-danger-subtle">

      <div class="card-body text-center">

        <h2 class="fw-bold text-danger">

          ₹{{ totalOutstanding.toFixed(2) }}

        </h2>

        <p class="text-muted mb-0">
          Total Outstanding
        </p>

      </div>

    </div>

  </div>

  <div class="col-md-3">

    <div class="card border-0 shadow-sm bg-success-subtle">

      <div class="card-body text-center">

        <h2 class="fw-bold text-success">

          ₹{{ totalPaid.toFixed(2) }}

        </h2>

        <p class="text-muted mb-0">
          Total Paid
        </p>

      </div>

    </div>

  </div>

</div>
