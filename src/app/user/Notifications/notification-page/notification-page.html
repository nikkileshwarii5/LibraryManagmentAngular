<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<div class="container py-4">

  <!-- Header -->

  <div class="card shadow-sm border-0 mb-4">

    <div class="card-body">

      <div class="d-flex justify-content-between align-items-start">

        <div class="d-flex align-items-center">

          <div class="notification-header-icon me-3">
            <i class="fa-solid fa-bell fs-3 text-white"></i>
          </div>

          <div>
            <h2 class="fw-bold mb-1">
              Notifications
            </h2>

            <p class="text-muted mb-0">

              <span *ngIf="unreadCount > 0">
                You have {{ unreadCount }} unread notification{{ unreadCount !== 1 ? 's' : '' }}
              </span>

              <span *ngIf="unreadCount === 0">
                All notifications are read
              </span>

            </p>
          </div>

        </div>

        <div class="d-flex gap-2">

          <button
            class="btn btn-outline-primary btn-sm"
            (click)="handleMarkAllAsRead()"
            [disabled]="unreadCount === 0"
          >
            <i class="fa-solid fa-envelope-open-text me-2"></i>
            Mark all as read
          </button>

          <button
            class="btn btn-outline-danger btn-sm"
            (click)="handleClearAll()"
            [disabled]="totalCount === 0"
          >
            <i class="fa-solid fa-trash-can me-2"></i>
            Clear all
          </button>

        </div>

      </div>

    </div>

  </div>

  <!-- Tabs -->

  <div class="card shadow-sm border-0 mb-4">

    <div class="card-body py-2">

      <ul class="nav nav-tabs border-0">

        <li class="nav-item">

          <button
            class="nav-link"
            [class.active]="tabValue === 'all'"
            (click)="handleTabChange('all')"
          >
            All
            <span class="badge bg-secondary ms-2">
              {{ totalCount }}
            </span>
          </button>

        </li>

        <li class="nav-item">

          <button
            class="nav-link"
            [class.active]="tabValue === 'unread'"
            (click)="handleTabChange('unread')"
          >
            Unread
            <span class="badge bg-danger ms-2">
              {{ unreadCount }}
            </span>
          </button>

        </li>

        <li class="nav-item">

          <button
            class="nav-link"
            [class.active]="tabValue === 'read'"
            (click)="handleTabChange('read')"
          >
            Read
            <span class="badge bg-secondary ms-2">
              {{ readCount }}
            </span>
          </button>

        </li>

      </ul>

    </div>

  </div>

  <!-- Filters -->

  <div class="card shadow-sm border-0 mb-4">

    <div class="card-body">

      <div class="d-flex flex-wrap gap-2">

      

        <button
  *ngFor="let item of notificationTypeEntries()"
  class="filter-chip"
  [ngClass]="selectedTypes.includes(item.key)
    ? 'active-chip'
    : ''"
  (click)="handleTypeFilter(item.key)"
>
  <i class="fa-solid {{ item.icon }} me-2"></i>
  {{ item.label }}
</button>

        <button
          *ngIf="selectedTypes.length > 0"
          class="btn btn-outline-danger btn-sm"
          (click)="clearFilters()"
        >
          <i class="fa-solid fa-xmark me-1"></i>
          Clear Filters
        </button>

      </div>

    </div>

  </div>

 
<div
  *ngIf="notifications.length === 0"
  class="card shadow-sm border-0 mt-4 empty-state-card"

>
  <div class="empty-state-content">

    <i
      [class]="'fa-solid ' + getEmptyState().icon + ' empty-state-icon'"
    ></i>

    <h3 class="empty-state-title">
      {{ getEmptyState().title }}
    </h3>

    <p class="empty-state-message">
      {{ getEmptyState().message }}
    </p>

  </div>
</div>

  <!-- Notification List -->

<div
  *ngIf="notifications.length > 0"
  class="d-flex flex-column gap-3"
>

  <!-- <app-notification-item
      *ngFor="let notification of notifications"
      [notification]="notification">
  </app-notification-item> -->


  <app-notification-item
    *ngFor="let notification of notifications"
    [notification]="notification"
    (menuClick)="openMenu($event, notification)">
</app-notification-item>

</div>

  <!-- Pagination -->

  <div
    *ngIf="totalPages > 1"
    class="d-flex justify-content-center mt-4"
  >

    <nav>

      <ul class="pagination">

        <li
          class="page-item"
          *ngFor="let item of [].constructor(totalPages); let i = index"
        >

          <button
            class="page-link"
            [class.active]="page === i + 1"
            (click)="handlePageChange(i + 1)"
          >
            {{ i + 1 }}
          </button>

        </li>

      </ul>

    </nav>

  </div>

</div>

<!-- Context Menu -->

<div
  class="notification-menu"
  *ngIf="showMenu"
   (click)="$event.stopPropagation()"
>



  <button
  class="dropdown-item"
  (click)="handleMarkAsRead()"
  [disabled]="selectedNotification?.isRead"
  [class.disabled]="selectedNotification?.isRead"
>
  <i class="fa-solid fa-check me-2"></i>
  Mark as Read
</button>

  <hr>

  <button
    class="dropdown-item text-danger"
    (click)="handleDelete()"
  >
    <i class="fa-solid fa-trash me-2"></i>
    Delete
  </button>




</div>
