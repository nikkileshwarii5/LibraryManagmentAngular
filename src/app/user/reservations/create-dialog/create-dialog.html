<div
  class="dialog-backdrop"
  *ngIf="open"
>

  <div class="dialog-container">

    <!-- Header -->
    <div class="dialog-header">

      <h2>
        Create New Reservation
      </h2>

      <button
        class="close-btn"
        (click)="close.emit()"
      >
        ✕
      </button>

    </div>

    <!-- Content -->
    <div class="dialog-content">

      <p class="dialog-text">
        Enter the <strong>Book ID</strong>
        you want to reserve.
      </p>

      <div class="input-group">

        <label>
          Book ID
        </label>

        <input
          type="number"
          [ngModel]="bookId"
          (ngModelChange)="bookIdChange.emit($event)"
        />

      </div>

    </div>

    <!-- Actions -->
    <div class="dialog-actions">

      <button
        class="cancel-button"
        (click)="close.emit()"
      >
        Cancel
      </button>

      <button
        class="reserve-button"
        [disabled]="!bookId"
        (click)="create.emit()"
      >
        Reserve
      </button>

    </div>

  </div>

</div>
