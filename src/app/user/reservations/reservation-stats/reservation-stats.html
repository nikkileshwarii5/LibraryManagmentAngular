<div class="row g-4 mb-4">

  <!-- Total Reservations -->
  <div class="col-md-4">

    <div class="card border-0 shadow-lg rounded-4 h-100 stats-card">

      <div class="card-body d-flex justify-content-between align-items-center p-4">

        <div>

          <p class="text-uppercase fw-semibold text-secondary small mb-2">
            Total Reservations
          </p>

          <h1 class="fw-bold display-4 mb-0 text-dark">
            {{ stats.total }}
          </h1>

        </div>

        <div
          class="icon-box bg-primary-gradient"
        >
          <i class="bi bi-bookmark-fill fs-3 text-white"></i>
        </div>

      </div>

    </div>

  </div>

  <!-- Active -->
  <div class="col-md-4">

    <div class="card border-warning-subtle bg-warning-light shadow-lg rounded-4 h-100 stats-card">

      <div class="card-body d-flex justify-content-between align-items-center p-4">

        <div>

          <p class="text-uppercase fw-semibold text-warning-emphasis small mb-2">
            Active
          </p>

          <h1 class="fw-bold display-4 mb-0 text-warning-emphasis">
            {{ stats.active }}
          </h1>

        </div>

        <div
          class="icon-box bg-warning-gradient"
        >
          <i class="bi bi-alarm fs-3 text-white"></i>
        </div>

      </div>

    </div>

  </div>

  <!-- Ready -->
  <div class="col-md-4">

    <div class="card border-success-subtle bg-success-light shadow-lg rounded-4 h-100 stats-card">

      <div class="card-body d-flex justify-content-between align-items-center p-4">

        <div>

          <p class="text-uppercase fw-semibold text-success small mb-2">
            Ready To Pick Up
          </p>

          <h1 class="fw-bold display-4 mb-0 text-success-emphasis">
            {{ stats.available }}
          </h1>

        </div>

        <div
          class="icon-box bg-success-gradient"
        >
          <i class="bi bi-calendar-check fs-3 text-white"></i>
        </div>

      </div>

    </div>

  </div>

</div>
