<div class="min-vh-100 d-flex align-items-center justify-content-center py-5 px-3 bg-light">

  <div class="w-100" style="max-width: 450px;">

    <!-- Header -->
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center gap-2 mb-4">
        <div class="p-2 bg-primary rounded">
          <!-- <mat-icon class="text-white">menu_book</mat-icon> -->
            <img src="book.png" class="logo-icon" />
        </div>
        <span class="fs-3 fw-bold text-dark">LibraOne</span>
      </div>

      <h2 class="fs-3 fw-bold text-dark mb-2">Create Account</h2>
      <p class="text-muted">Join our community of book lovers</p>
    </div>

    <!-- Card -->
    <div class="card shadow-lg border-0 rounded-4 p-4">

      <!-- Error -->
      <div *ngIf="error" class="alert alert-danger">
        {{ error }}
      </div>

      <!-- Form -->
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="d-grid gap-4">

        <!-- Full Name -->
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Full Name</mat-label>
          <input matInput formControlName="fullName">
          <mat-icon matPrefix>person</mat-icon>
        </mat-form-field>

        <!-- Email -->
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Email Address</mat-label>
          <input matInput formControlName="email">
          <mat-icon matPrefix>email</mat-icon>
        </mat-form-field>

        <!-- Password -->
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Password</mat-label>
          <input matInput [type]="showPassword ? 'text' : 'password'" formControlName="password">

          <mat-icon matPrefix>lock</mat-icon>

          <button mat-icon-button matSuffix type="button"
            (click)="showPassword = !showPassword">
            <mat-icon>
              {{ showPassword ? 'visibility_off' : 'visibility' }}
            </mat-icon>
          </button>
        </mat-form-field>

        <!-- Phone -->
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Phone Number</mat-label>
          <input matInput formControlName="phone">
          <mat-icon matPrefix>phone</mat-icon>
        </mat-form-field>

        <!-- Button -->
        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="w-100 py-2 fw-semibold rounded"
          [disabled]="loading">

          <span *ngIf="!loading">Create Account</span>

          <span *ngIf="loading" class="d-flex align-items-center justify-content-center gap-2">
            <mat-progress-spinner diameter="20" mode="indeterminate"></mat-progress-spinner>
            <span>Creating Account...</span>
          </span>

        </button>

      </form>

      <!-- Login Link -->
      <div class="mt-4 text-center">
        <p class="text-muted">
          Already have an account?
          <a routerLink="/login"
             class="fw-semibold text-primary text-decoration-underline">
            Sign In
          </a>
        </p>
      </div>

    </div>

    <!-- Terms -->
    <p class="mt-4 text-center text-muted small">
      By creating an account, you agree to our
      <a class="text-primary text-decoration-none">Terms</a> and
      <a class="text-primary text-decoration-none">Privacy Policy</a>
    </p>

  </div>
</div>
