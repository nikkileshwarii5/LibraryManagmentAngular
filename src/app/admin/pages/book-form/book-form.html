<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<div class="modal d-block custom-modal">
  <div class="modal-dialog modal-lg">
    <div class="modal-content p-4">

      <!-- HEADER -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold">{{ book ? 'Edit Book' : 'Add New Book' }}</h4>
        <button class="btn-close" (click)="close.emit()"></button>
      </div>

      <!-- FORM GRID -->
      <div class="row g-3">

        <div class="col-md-6">
          <input class="form-control" placeholder="ISBN *" [(ngModel)]="formData.isbn">
        </div>

        <div class="col-md-6">
          <input class="form-control" placeholder="Title *" [(ngModel)]="formData.title">
        </div>

        <div class="col-md-6">
          <input class="form-control" placeholder="Author *" [(ngModel)]="formData.author">
        </div>

   

        <div class="col-md-6">
  <select class="form-control"
          [(ngModel)]="formData.genreId">

    <option value="">Select Genre</option>

    <option *ngFor="let genre of genres"
            [value]="genre.id">
      {{ genre.name }}
    </option>

  </select>
</div>

        <div class="col-md-6">
          <input class="form-control" placeholder="Publisher" [(ngModel)]="formData.publisher">
        </div>

        <div class="col-md-6">
          <input type="date" class="form-control" [(ngModel)]="formData.publicationDate">
        </div>

        <div class="col-md-6">
          <input class="form-control" placeholder="Language" [(ngModel)]="formData.language">
        </div>

        <div class="col-md-6">
          <input type="number" class="form-control" placeholder="Pages" [(ngModel)]="formData.pages">
        </div>

        <div class="col-md-12">
          <input type="number" class="form-control" placeholder="Price" [(ngModel)]="formData.price">
        </div>

<div class="col-12">
  <div class="row g-3">

    <!-- LEFT: AVAILABLE COPIES -->
    <div class="col-md-6">

      <div class="floating-group">
        <input type="number"
               [(ngModel)]="formData.availableCopies"
               placeholder=" "
               required>
        <label>Available Copies *</label>
      </div>

      <small class="helper-text">
        Copies currently available for checkout
      </small>

    </div>

    <!-- RIGHT: TOTAL COPIES -->
    <div class="col-md-6">

      <div class="floating-group">
        <input type="number"
               [(ngModel)]="formData.totalCopies"
               placeholder=" "
               required>
        <label>Total Copies *</label>
      </div>

      <small class="helper-text">
        Total number of copies in inventory
      </small>

    </div>

  </div>
</div>


        <!-- DESCRIPTION -->
        <div class="col-12">
          <textarea class="form-control" rows="3"
                    placeholder="Description"
                    [(ngModel)]="formData.description"></textarea>
        </div>

        <!-- IMAGE UPLOAD -->
        <div class="col-12">
          <label class="fw-bold mb-2">Cover Image</label>

          <div class="upload-box text-center p-4">

            <input type="file" hidden #fileInput (change)="onFileChange($event)">
            
            <div *ngIf="!formData.coverImageUrl" (click)="fileInput.click()">
              <i class="bi bi-cloud-upload fs-1 text-primary"></i>
              <p class="mb-0 fw-bold">Click to upload or drag and drop</p>
              <small>PNG, JPG up to 5MB</small>
            </div>

            <div *ngIf="formData.coverImageUrl">
              <img [src]="formData.coverImageUrl" class="img-preview">
              <button class="btn btn-danger btn-sm mt-2"
                      (click)="formData.coverImageUrl=''">Remove</button>
            </div>

          </div>

          <div *ngIf="uploadError" class="text-danger mt-2">
            {{ uploadError }}
          </div>
        </div>

      </div>

      <!-- FOOTER -->
      <div class="d-flex justify-content-end mt-4">
        <button class="btn btn-light me-2" (click)="close.emit()">Cancel</button>
        <button class="btn create-btn" (click)="submit()">
          {{ book ? 'Update' : 'Create' }}
        </button>
      </div>

    </div>
  </div>
</div>
