<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<div class="card stats-card text-white shadow-sm h-100 rounded-2"  [ngClass]="getColorClass()">
  <div class="card-body">

    <div class="d-flex justify-content-between">

      <!-- Left -->
      <div>
        <small class="text-uppercase">{{title}}</small>

        <h3 class="fw-bold">
          {{ loading ? '...' : value }}
        </h3>

        <small *ngIf="subtitle">{{subtitle}}</small>
      </div>

      <!-- Icon -->
      <!-- <div class="fs-2">
        <i [class]="icon"></i>
      </div> -->

       <!-- Rounded Icon -->
    <div
      class="rounded-circle d-flex justify-content-center align-items-center"
      [ngClass]="'bg-' + color + '-subtle'"
      style="width:56px;height:56px;"
    >
      <i [class]="icon + ' fs-4 text-' + color"></i>
    </div>


    </div>

    <!-- Trend -->
    <div *ngIf="trend" class="mt-3 border-top pt-2">
      <small>
  <i *ngIf="trend === 'up'" class="fa-solid fa-arrow-trend-up"></i>
  <i *ngIf="trend === 'down'" class="fa-solid fa-arrow-trend-down"></i>

  {{trendValue}} from last month
</small>
    </div>

  </div>
</div>
